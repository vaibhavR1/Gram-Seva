server.port=8080
spring.application.name=gramseva-backend

# Profiles: active dev/h2 by default for zero-friction launch; activate 'postgres' when ready
spring.profiles.active=dev

# H2 Console & Config (Dev Profile default)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA General
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Security & JWT Configuration (HMAC-SHA256 256-bit key)
gramseva.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
gramseva.jwt.expiration-ms=86400000

# File upload max size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger / OpenAPI Doc URL
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
